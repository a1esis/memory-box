<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Memory Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

  <div id="canvas-wrap">
    <canvas id="scene"></canvas>
  </div>

  <!-- soft vignette overlay -->
  <div id="vignette"></div>

  <!-- top-left title -->
  <div id="title-mark">Memory Box</div>

  <!-- minimal UI, top-right -->
  <div id="ui-bar">
    <button id="sound-btn" class="pill" title="Toggle sound" aria-label="Toggle sound">
      <span id="sound-icon">♪</span>
    </button>
    <button id="add-btn" class="pill" title="Add a memory">+ Add Memory</button>
    <button id="share-btn" class="pill" title="Generate a link to share this box">🔗 Share Box</button>
  </div>

  <input type="file" id="file-input" accept="image/*" multiple hidden />

  <!-- first-time guidance -->
  <div id="guide-text"></div>

  <!-- fullscreen memory viewer -->
  <div id="viewer-overlay" class="hidden">
    <div id="viewer-stage">
      <img id="viewer-image" src="" alt="A memory" />
    </div>
    <button id="viewer-close" aria-label="Put it back">✕</button>
    <div id="viewer-hint">click anywhere to put it back</div>
  </div>

  <!-- drop hint -->
  <div id="drag-hint" class="hidden">drop to add to the box</div>

  <!-- share link overlay -->
  <div id="share-overlay" class="hidden">
    <div id="share-card">
      <div id="share-title">Share this box</div>
      <div id="share-status">Gathering the memories&hellip;</div>
      <div id="share-link-row" class="hidden">
        <input id="share-link-input" type="text" readonly />
        <button id="share-copy-btn" class="pill">Copy</button>
      </div>
      <div id="share-hint">Anyone with this link can open this exact box.</div>
    </div>
    <button id="share-close" aria-label="Close">✕</button>
  </div>

  <!-- trash target: drag a memory here to delete it -->
  <div id="trash-label">drop to remove</div>
  <div id="trash-zone" aria-hidden="true">🗑</div>

  <!-- how to interact, small footer hint -->
  <div id="footer-hint">drag to rearrange · click to look closer</div>

  <div id="loading-screen">
    <div id="loading-text">opening the room&hellip;</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js?v=3"></script>
  <script src="script.js?v=7"></script>
</body>
</html>
